server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: high-concurrency-local-services-platform
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/local_services?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER:local_services}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.anson.localservices.entity
logging:
  level:
    com.anson.localservices: ${APP_LOG_LEVEL:info}
  pattern:
    dateformat: mm:ss.SSS
